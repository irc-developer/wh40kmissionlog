name: Publicar en Pages (manual)
on:
 workflow_dispatch:
  inputs:
   base:
    description: Ruta final de Pages, con barra inicial y final
    required: true
permissions:
 contents: read
 pages: write
 id-token: write
concurrency:
 group: pages
 cancel-in-progress: false
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with:
      node-version: 24
      cache: npm
   - run: npm ci
   - run: npm test
   - run: npm run lint
   - run: npm run build
     env:
      PAGES_BASE: ${{ inputs.base }}
   - uses: actions/upload-pages-artifact@v3
     with:
      path: dist
 deploy:
  needs: build
  environment:
   name: github-pages
   url: ${{ steps.deployment.outputs.page_url }}
  runs-on: ubuntu-latest
  steps:
   - name: Publicar
     id: deployment
     uses: actions/deploy-pages@v4
